site_name: Richie Finance Documentation
site_description: The liquidity and yield layer for the PDAI community on PulseChain.
site_url: https://docs.richie.finance/
repo_url: https://github.com/Richie-Finance/protocol-documentation
repo_name: Richie-Finance/protocol-documentation

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Welcome aboard:
      - Welcome to Richie Finance: index.md
      - Introduction: welcome/introduction.md
      - General FAQs: welcome/general-faqs.md
  - The protocol:
      - Protocol overview: protocol/overview.md
      - Tokens:
          - Overview: protocol/tokens.md
          - CASH: protocol/cash.md
          - RICH: protocol/rich.md
      - Liquidity farms: protocol/liquidity-farms.md
      - RICH staking: protocol/rich-staking.md
      - Supply and epochs: protocol/supply-and-epochs.md
      - Launch and distribution: protocol/launch-and-distribution.md
  - Revenue and peg defense:
      - Peg Stability Module: mechanisms/peg-stability-module.md
      - Revenue generation: mechanisms/revenue-generation.md
      - Peg defense: mechanisms/peg-defense.md
      - Treasury rebates: mechanisms/treasury-rebates.md
      - Protocol owned liquidity: mechanisms/protocol-owned-liquidity.md
  - Using Richie:
      - Getting started: guides/getting-started.md
      - Providing liquidity: guides/providing-liquidity.md
      - Claiming rewards: guides/claiming-rewards.md
      - Staking RICH: guides/staking-rich.md
      - Best strategies: guides/strategies.md
  - Protocol information:
      - Parameters and fees: information/parameters-and-fees.md
      - Contracts and official links: information/contracts-and-official-links.md
      - Governance and permissions: information/governance-and-permissions.md
      - Risks and security: information/risks-and-security.md
      - Glossary: information/glossary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Richie-Finance
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/richie_finance
    - icon: fontawesome/brands/telegram
      link: https://t.me/sourcecodesystems

copyright: Copyright &copy; Richie Finance 2026. All rights reserved.
